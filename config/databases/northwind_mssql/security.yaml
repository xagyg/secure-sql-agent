# Security policy for Northwind on SQL Server: who may see what.
#
# The same roles and rules as the PostgreSQL Northwind
# (config/databases/northwind/security.yaml, which explains the format), in SQL
# Server's names: schema dbo, PascalCase tables and columns, and
# "Order Details" with a space. A name without a schema is in dbo.
#
# Differences from the PostgreSQL version:
#   - Employees.Photo is denied for both roles: a binary image the model
#     can't use, which would only bloat results.
#   - The 16 Northwind views (Invoices, Sales by Category, ...) are not
#     allowed; they repeat the tables' data. Add one to a role's allow
#     list (and to sources.include in semantic/model.yaml) to use it.
#
# The login (sqlagent_ro) must itself be read-only - db_datareader only:
# SQL Server has no read-only session, so its permissions are the
# database's own boundary. See README.md "SQL Server".

version: 1
default: deny

roles:
  # Every anonymous visitor to the public demo (api.py).
  demo:
    description: Public demo - narrow, read-only view of Northwind
    allow:
      - dbo.Customers
      - dbo.Orders
      - dbo.Order Details
      - dbo.Products
      - dbo.Categories
      - dbo.Suppliers
      - dbo.Employees
      - dbo.Shippers
    deny_columns:
      dbo.Customers: [Phone, Fax, Address]
      dbo.Employees: [HomePhone, Photo]

  # The local command-line REPL (main.py). The name also gives this role
  # its affinity to the Sales domain (semantic/domains.yaml).
  sales:
    description: Local development - all of Northwind except personal phone numbers
    allow:
      - dbo.Customers
      - dbo.Orders
      - dbo.Order Details
      - dbo.Products
      - dbo.Categories
      - dbo.Suppliers
      - dbo.Employees
      - dbo.EmployeeTerritories
      - dbo.Region
      - dbo.Shippers
      - dbo.Territories
      - dbo.CustomerDemographics
      - dbo.CustomerCustomerDemo
    deny_columns:
      dbo.Customers: [Phone]
      dbo.Employees: [HomePhone, Photo]

  # Row-scoped sales manager: everything "sales" has (extends: its tables
  # and hidden columns), but which ROWS depend on the grant (group_grants
  # below) - all rows, a region, or the manager's own team. One role, many
  # scopes: no national / regional / local copies of it. Anything added
  # here adds to sales; only undeny / undeny_columns could show something
  # sales hides, and startup prints any that do.
  sales_manager:
    extends: sales
    description: Sales manager - rows limited by the grant's scope
    scope: required

# Identity-provider group -> roles.
group_roles:
  Northwind-Sales: [sales]
  Public-Demo: [demo]

# ---------------------------------------------------------------------------
# Row scope (see README "Row-level security"). Each dimension says how it
# restricts every table a scoped role can query:
#   column    the table carries the dimension:     {column: EmployeeID}
#   via       in scope when a related row is:      {via: dbo.Orders}
#   unscoped  reference data, the same for everyone
# A via rule joins on the database's foreign key between the two tables.
# Where there's no foreign key, or more than one, say which columns:
#     {via: dbo.Orders, join: {OrderID: OrderID}}   (this table: that table)
# Startup stops rather than guess, and prints each join it takes.
# A table a scoped role allows with no rule here stops sign-in for
# anyone granted that scope, unless the scope says default: unscoped:
# then every table it doesn't list is reference data (all rows), and
# sign-in prints which tables that covers. List a table that needs
# filtering before adding it to a role.
# ---------------------------------------------------------------------------
scopes:
  # Orders handled by particular employees: a rep's own, or a manager's
  # team (the employee and everyone below them through ReportsTo).
  salesperson:
    user_attribute: employee_id          # from sign-in
    hierarchy: {table: dbo.Employees, key: EmployeeID, parent: ReportsTo}
    default: unscoped                    # everything not listed: all rows
    tables:
      dbo.Orders:               {column: EmployeeID}
      dbo.Order Details:        {via: dbo.Orders}
      dbo.Customers:            {via: dbo.Orders}
      dbo.CustomerCustomerDemo: {via: dbo.Customers}
      dbo.Employees:            {column: EmployeeID}
      dbo.EmployeeTerritories:  {column: EmployeeID}

  # Sales regions: orders handled by employees who cover a territory in
  # the region, and the customers, lines and staff that follow from them.
  region:
    default: unscoped
    tables:
      dbo.Region:               {column: RegionID}
      dbo.Territories:          {column: RegionID}
      dbo.EmployeeTerritories:  {via: dbo.Territories}
      dbo.Employees:            {via: dbo.EmployeeTerritories}
      dbo.Orders:               {via: dbo.Employees}
      dbo.Order Details:        {via: dbo.Orders}
      dbo.Customers:            {via: dbo.Orders}
      dbo.CustomerCustomerDemo: {via: dbo.Customers}

# Identity-provider group -> grants (role + which rows). Who is in each
# group, and their employee_id, come from sign-in. DEMO ONLY: for
# local testing, config/idp/northwind.yaml stands in for it.
group_grants:
  Sales-National: [{role: sales_manager, scope: unrestricted}]
  Sales-Eastern:  [{role: sales_manager, scope: {region: [1]}}]
  Sales-Team:     [{role: sales_manager, scope: {salesperson: team}}]
  Sales-Rep:      [{role: sales_manager, scope: {salesperson: self}}]
