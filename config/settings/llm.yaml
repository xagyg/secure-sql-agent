# The LLM that turns questions into SQL (sqlagent/adaptive/llm.py).
#
# Environment variables override these (for a one-off run or a
# deployment): OLLAMA_HOST, OLLAMA_MODEL, OLLAMA_CONNECT_TIMEOUT,
# OLLAMA_READ_TIMEOUT.
#
# SECRETS: a tunnelled Ollama (e.g. behind ngrok) may need basic auth.
# The username and password are read from the environment variables
# named below, never from this file; a literal "username:"/"password:"
# key, or an Authorization header, is rejected at startup. With either
# variable unset, no auth is sent (run.ps1 clears both for a local
# Ollama).

host: http://localhost:11434
model: qwen3-coder

username_env: OLLAMA_USERNAME   # value from the environment, never here
password_env: OLLAMA_PASSWORD   # value from the environment, never here

# Seconds. The ollama client's own default is no timeout at all, so a
# call on a silently dropped connection (e.g. an idle ngrok tunnel) hung
# forever. connect: reaching the server; read: waiting for the model.
connect_timeout: 10
read_timeout: 120

# Earlier questions sent with each new question (follow-ups such as
# "now show me only those in Germany"). Each turn carries a short summary
# of its result (row count, columns, a few sample rows), not the full
# answer; only the most recent turn carries its SQL (history_sql_turns).
history_turns: 3
history_sample_rows: 3        # sample rows per result summary
history_value_chars: 40       # longest single value shown
history_summary_chars: 400    # longest summary per turn
history_sql_turns: 1          # most recent turns that also carry their SQL (0 = none)

# A correction shows the model the SQL that failed. If the prepared SQL is
# longer than this many characters (SELECT * expanded to every column),
# the model's own SQL is shown instead, so the correction stays quick.
correction_sql_chars: 4000

# Explaining a result: at most this many rows are shown to the model (one
# compact line each), and values longer than explain_value_chars are cut.
# The exact row count is always stated, so the answer can say "100 rows,
# for example ..." without miscounting.
explain_rows: 50
explain_value_chars: 300
explain_result_chars: 8000    # ~2,000 tokens of rows; wide rows show fewer

# Ollama options sent with every request (leave one empty to use Ollama's
# default). temperature 0 and a fixed seed make the same prompt give the
# same answer, so two batch runs can be compared.
#
# num_ctx is the context window in tokens. Set, it takes precedence over
# the Ollama app's context-length setting; empty, nothing is sent and the
# app's setting is used. A prompt longer than the context is cut without
# an error, losing part of the schema and rules - log_tokens warns when
# Ollama counts far fewer tokens than were sent.
temperature: 0
seed: 42
num_ctx:
# Print prompt/output token counts and times for each call, with a
# warning when a prompt was cut or nears num_ctx.
log_tokens: true

# Sent with every request. Skips ngrok's browser warning page; harmless
# without ngrok.
headers:
  ngrok-skip-browser-warning: "true"
