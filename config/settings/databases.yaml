# Which databases the agent can run against, and how to reach each one.
#
# Pick one at startup:
#     .\run.ps1 -db adventureworks          (or -local for the REPL)
#     $env:SQLAGENT_DATABASE = "adventureworks"
# With neither, "default" below is used. Loaded by sqlagent/databases.py;
# any problem in this file, or an unknown name, stops startup.
#
# engine: the database product - postgresql or sqlserver. It decides the
# SQL dialect, the driver and the catalog queries
# (sqlagent/execution/engines/). default_schema, if set, is the schema for
# a bare table name; otherwise the engine's (public for PostgreSQL, dbo
# for SQL Server).
#
# Each database brings its own files, in config/databases/<name>/:
#     security.yaml     who may see what (required)
#     semantic/         what the data means (optional)
#     identity.yaml     how the agent talks about it (optional)
#
# Those are defaults. Set security_file, semantic_path or identity_file to
# use files elsewhere (a relative path is from the project root). Use them
# when several databases have the same schema - dev, test and production
# copies of one application - so they share one semantic model and
# identity, and differ only in connection and security:
#
#     northwind_test:
#       engine: postgresql
#       connection: {host: test-db, database: northwind, user: sqlagent_ro,
#                    password_env: PG_TEST_PASSWORD}
#       semantic_path: config/databases/northwind/semantic        # shared
#       identity_file: config/databases/northwind/identity.yaml   # shared
#       # security_file: config/databases/northwind_test/security.yaml (default)
#       repl_roles: [sales]
#       demo_roles: [demo]
#
# Test should normally run production's security policy - the roles,
# denied columns and row scopes - or it isn't testing it. What usually
# differs is which groups hold which roles (group_roles, group_grants),
# and dev/test may use local identities (idp, below), which production
# shouldn't have.
# A semantic model can only be shared by databases with the same table and
# column names: northwind and northwind_mssql each need their own.
#
# DEMO ONLY - idp: whose local identities stand in for sign-in with
# .\run.ps1 -local -identity <name>: config/idp/<idp>.yaml, the database's
# own name unless set. One file per organisation, as an identity provider
# would hold them, so two copies of the same company share their people.
# In a deployment the identity provider supplies them and this isn't read.
#
# SECRETS: the password is never stored here. password_env names the
# environment variable that holds it, and a literal "password:" key is
# rejected at startup. run.ps1 sets PG_PASSWORD for you (from the
# window, then your Windows user variables, then a hidden prompt), and
# startup prints whether it was found.
#
# How the agent talks about each database - its name in prompts and messages,
# example questions, and worked SQL examples for the LLM - is in
# config/databases/<name>/identity.yaml, next to its security and semantic
# files (identity_file to use another).

version: 1
default: northwind

databases:
  northwind:
    description: Northwind sample database (about a dozen tables)
    engine: postgresql
    connection:
      host: localhost
      port: 5432
      database: northwind
      user: sqlagent_ro
      password_env: PG_PASSWORD     # value from the environment, never here
    # Roles from config/databases/northwind/security.yaml.
    repl_roles: [sales]      # main.py (SQLAGENT_ROLES overrides)
    demo_roles: [demo]       # api.py, every anonymous visitor

  # AdventureWorks (about 70 tables in sales, purchasing,
  # production, humanresources and person schemas).
  adventureworks:
    description: AdventureWorks (multi-schema, ERP-like)
    engine: postgresql
    connection:
      host: localhost
      port: 5432
      database: adventureworks
      user: sqlagent_ro
      password_env: PG_PASSWORD     # value from the environment, never here
    repl_roles: [sales]
    demo_roles: [demo]

  # Northwind on SQL Server: the original Northwind (dbo schema,
  # PascalCase names, "Order Details" with a space). Its security policy
  # and semantic model are in config/databases/northwind_mssql/.
  northwind_mssql:
    description: Northwind on SQL Server
    engine: sqlserver
    connection:
      host: localhost
      database: Northwind
      user: sqlagent_ro                   # db_datareader only; see README "SQL Server"
      password_env: SQLSERVER_PASSWORD    # value from the environment, never here
      trust_server_certificate: true      # local server's self-signed certificate
    repl_roles: [sales]
    demo_roles: [demo]
    idp: northwind           # DEMO ONLY: the same people as the PostgreSQL copy
