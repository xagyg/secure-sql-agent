# The local command-line REPL (main.py, .\run.ps1 -local).
#
# In a real deployment the user and roles come from the user's sign-in
# (identity-provider groups -> roles, see group_roles in
# config/databases/<database>/security.yaml). Locally the user is set here
# [SQLAGENT_USER] and the roles are the database's repl_roles in
# databases.yaml [SQLAGENT_ROLES, comma-separated].

user: brad

# With -noExplain / --no-explain the rows are shown as a table instead of
# the LLM's explanation: at most table_rows rows (then "... N more
# row(s)"), each value cut to table_value_chars characters. A query never
# returns more than query.yaml max_rows rows.
table_rows: 20
table_value_chars: 40

# How rewritten SQL ([sql after rewrite], [sql after withholding], the
# row-scoped query) is laid out in the console log, here and under the
# API. Display only: the SQL that runs, the history and the prompts keep
# the compact text. The model's own SQL ([sql], [corrected sql]) is
# always shown as it wrote it.
sql_format:
  pretty: true              # false: one line, as before
  pad: 4                    # indent of the column list under SELECT
  indent: 4                 # indent of subqueries and WHERE conditions
  leading_comma: false      # true: ", column" at the start of each line
  max_text_width: 80        # break a clause longer than this; lower it
                            # (e.g. 40) to put each AND on its own line
