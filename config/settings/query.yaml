# Limits applied to every generated query, whoever asks.
#
# These are guardrails: the loader enforces upper bounds, so a typo can't
# switch them off.

# PostgreSQL statement_timeout, in seconds [PG_STATEMENT_TIMEOUT_SECONDS].
# Must be below api.yaml agent_timeout: when the API gives up on a
# request, its worker thread and database query keep running, so a long
# timeout lets abandoned queries (a cross join, pg_sleep, ...) tie up
# connections after the visitor has gone.
statement_timeout_seconds: 10

# LIMIT added to every query that doesn't have one (sql_policy.py), and
# the most rows the result policy will return.
max_rows: 100

# Most result bytes returned (result_policy.py).
max_result_bytes: 1000000

# Most values one row-scope dimension may resolve to for one user - e.g. a
# senior manager's "team" (security_policy.py). Each value is written into
# the query (employee_id IN (...)) once per scoped table it reads, and very
# long lists slow planning and fail on SQL Server (error 8623). Over the
# limit, that user's access isn't built and startup / sign-in stops with a
# message: model a large hierarchy as a closure table instead, so the query
# carries one value (README "Large scopes"). It never falls back to running
# the long list, or to no filter.
max_scope_values: 1000
